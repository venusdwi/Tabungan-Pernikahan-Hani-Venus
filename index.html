<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabungan Hani & Venus</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; padding: 15px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #0f4c81; font-size: 22px; margin-bottom: 15px; }
        .card { background: linear-gradient(135deg, #1565c0, #42a5f5); color: white; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 15px; }
        .cd { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
        .cd-box { background: rgba(255,255,255,0.2); padding: 5px 8px; border-radius: 6px; min-width: 50px; }
        .cd-num { font-size: 16px; font-weight: bold; }
        .cd-lbl { font-size: 8px; text-transform: uppercase; }
        form { display: flex; flex-direction: column; gap: 10px; background: #f9f9f9; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { background: #0f4c81; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #e3f2fd; color: #0d47a1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tabungan Pernikahan<br>Hani & Venus 💍</h1>
        <div class="card">
            <div>Sisa Saldo Tabungan</div>
            <div id="saldo" style="font-size: 28px; font-weight: bold; margin: 5px 0;">Rp 0</div>
            <div style="font-size: 11px; margin-top: 10px;">💍 Menuju 03 April 2027</div>
            <div class="cd">
                <div class="cd-box"><div class="cd-num" id="d">0</div><div class="cd-lbl">Hari</div></div>
                <div class="cd-box"><div class="cd-num" id="h">0</div><div class="cd-lbl">Jam</div></div>
                <div class="cd-box"><div class="cd-num" id="m">0</div><div class="cd-lbl">Menit</div></div>
                <div class="cd-box"><div class="cd-num" id="s">0</div><div class="cd-lbl">Detik</div></div>
            </div>
        </div>

        <form id="form">
            <select id="type" onchange="gantiTipe()">
                <option value="in">Pemasukan (Tabungan)</option>
                <option value="out">Pengeluaran</option>
            </select>
            <select id="person">
                <option value="Hani">Hani</option>
                <option value="Venus">Venus</option>
            </select>
            <input type="text" id="cat" placeholder="Keterangan Pengeluaran" style="display:none;">
            <input type="date" id="date" required>
            <input type="number" id="amount" placeholder="Jumlah (Rp)" required>
            <button type="submit" id="btn">Tambah Pemasukan</button>
        </form>

        <h3>Riwayat Transaksi</h3>
        <table>
            <thead><tr><th>Tanggal</th><th>Ket</th><th>Jumlah</th><th>Aksi</th></tr></thead>
            <tbody id="list"></tbody>
        </table>
    </div>

    <script>
        // Hitung Mundur Aman
        const target = new Date(2027, 3, 3, 0, 0, 0).getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = target - now;
            if (diff > 0) {
                document.getElementById('d').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById('h').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById('m').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById('s').innerText = Math.floor((diff % (1000 * 60)) / 1000);
            }
        }, 1000);

        // Tanggal otomatis hari ini
        document.getElementById('date').valueAsDate = new Date();

        function gantiTipe() {
            const t = document.getElementById('type').value;
            document.getElementById('person').style.display = t === 'in' ? 'block' : 'none';
            document.getElementById('cat').style.display = t === 'out' ? 'block' : 'none';
            document.getElementById('btn').innerText = t === 'in' ? 'Tambah Pemasukan' : 'Tambah Pengeluaran';
        }

        function getData() {
            return JSON.parse(localStorage.getItem('data_tabungan') || '[]');
        }

        function save(d) {
            localStorage.setItem('data_tabungan', JSON.stringify(d));
            render();
        }

        function render() {
            const data = getData();
            const list = document.getElementById('list');
            list.innerHTML = '';
            let saldo = 0;
            data.forEach((item, index) => {
                if (item.type === 'in') saldo += item.amount;
                else saldo -= item.amount;

                list.innerHTML += `<tr>
                    <td>${item.date}</td>
                    <td><b>${item.type === 'in' ? item.person : item.cat}</b></td>
                    <td style="color:${item.type === 'in' ? 'blue' : 'red'}">Rp ${item.amount.toLocaleString('id-ID')}</td>
                    <td><button onclick="del(${index})" style="padding:2px 6px; background:red; color:white; border:none; border-radius:4px;">Hapus</button></td>
                </tr>`;
            });
            document.getElementById('saldo').innerText = 'Rp ' + saldo.toLocaleString('id-ID');
        }

        document.getElementById('form').addEventListener('submit', (e) => {
            e.preventDefault();
            const type = document.getElementById('type').value;
            const data = getData();
            data.push({
                type: type,
                person: document.getElementById('person').value,
                cat: document.getElementById('cat').value || 'Pengeluaran',
                date: document.getElementById('date').value,
                amount: parseFloat(document.getElementById('amount').value)
            });
            save(data);
            document.getElementById('amount').value = '';
            document.getElementById('cat').value = '';
        });

        function del(i) {
            if(confirm('Hapus transaksi ini?')) {
                const data = getData();
                data.splice(i, 1);
                save(data);
            }
        }

        render();
    </script>
</body>
</html>
