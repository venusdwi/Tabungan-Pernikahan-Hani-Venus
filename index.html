<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TABUNGAN PERNIKAHAN Hani & Venus 💍</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- jsPDF Library untuk Export PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <!-- DUKUNGAN APLIKASI PWA UNTUK ANDROID & IOS -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tabungan HV">
    <link rel="apple-touch-icon" href="logo.png">

    <meta property="og:title" content="TABUNGAN PERNIKAHAN Hani & Venus 💍">
    <meta property="og:description" content="Mengumpulkan kebaikan, menyatukan impian menuju hari bahagia.">
    <meta property="og:image" content="https://venusdwi.github.io/Tabungan-Pernikahan-Hani-Venus/logo.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>

    <!-- FIREBASE SDK (FIRESTORE & APP) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        themeBlue: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc',
                            400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1',
                            800: '#075985', 900: '#0c4a6e',
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        num: ['"Outfit"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* PERBAIKAN UTAMA: Mengunci pergeseran layar / body agar stabil di semua HP */
        html, body {
            overflow-x: hidden;
            position: relative;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #090d16; 
            transition: background-color 0.3s ease, color 0.3s ease; 
        }
        
        .font-num { font-family: 'Outfit', sans-serif; font-variant-numeric: tabular-nums; }
        .glass-box {
            background-color: rgba(255, 255, 255, var(--box-opacity, 0.75));
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(2, 132, 199, 0.15);
            transition: background-color 0.15s ease;
        }
        #bgImageLayer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            pointer-events: none;
            z-index: -20;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
        }

        .zoom-in-bg {
            animation: smoothZoom 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes smoothZoom {
            0% { transform: scale(1.15); }
            100% { transform: scale(1.0); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(2, 132, 199, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(2, 132, 199, 0.6); }

        .pin-btn {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 75px; 
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            font-weight: 700;
            color: white;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.1s ease, background-color 0.1s ease;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        @media (hover: hover) {
            .pin-btn:hover { background-color: rgba(255, 255, 255, 0.15); }
        }
        
        .pin-btn:active {
            transform: scale(0.9);
            background-color: rgba(255, 255, 255, 0.3);
        }

        .pin-btn-reset {
            background-color: rgba(244, 63, 94, 0.08);
            border-color: rgba(244, 63, 94, 0.15);
            color: rgb(251, 113, 133);
        }
        .pin-btn-reset:active { background-color: rgba(244, 63, 94, 0.25); }

        .pin-btn-del {
            background-color: rgba(245, 158, 11, 0.08);
            border-color: rgba(245, 158, 11, 0.15);
            color: rgb(251, 191, 36);
        }
        .pin-btn-del:active { background-color: rgba(245, 158, 11, 0.25); }

        input[type="text"], input[type="date"], input[type="time"], input[type="number"] {
            font-size: 16px !important; 
        }

        @keyframes animFade {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes animZoom {
            0% { opacity: 0; transform: scale(1.3); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes animSlide {
            0% { opacity: 0; transform: translateX(80px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes animRotate {
            0% { opacity: 0; transform: rotate(5deg) scale(1.1); }
            100% { opacity: 1; transform: rotate(0deg) scale(1); }
        }

        .effect-fade { animation: animFade 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .effect-zoom { animation: animZoom 0.8s cubic-bezier(0.25, 1, 0.3, 1) forwards; }
        .effect-slide { animation: animSlide 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .effect-rotate { animation: animRotate 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    </style>
</head>
<body id="appBody" class="min-h-screen text-slate-800 pb-12 relative overflow-x-hidden bg-slate-950">
