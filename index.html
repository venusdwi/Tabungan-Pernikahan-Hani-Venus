<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabungan Pernikahan Hani & Venus</title>
    <!-- Import Google Fonts: Playfair Display (Judul) & Plus Jakarta Sans (Isi) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --warna-utama: #0f4c81;          /* Warna biru klasik & elegan */
            --warna-hover: #0a3357;          /* Warna tombol saat ditekan */
            --kartu-gradasi-1: rgba(21, 101, 192, 0.85);   
            --kartu-gradasi-2: rgba(66, 165, 245, 0.85);
            --bg-halaman: #f0f4f8;           /* Warna latar default */
            --bg-header-tabel: rgba(227, 242, 253, 0.85);      
            --teks-header-tabel: #0d47a1;     
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        html, body {
            min-height: 100vh;
        }

        body {
            background-color: var(--bg-halaman);
            background-size: cover;
            background-position: center center;
            background-attachment: fixed; /* Latar belakang tidak ikut bergerak saat di-scroll */
            background-repeat: no-repeat;
            color: #111;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.25);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.4);
            margin: auto 0;
        }

        h1 {
            text-align: center;
            color: var(--warna-utama);
            margin-bottom: 22px;
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1.3;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.9);
        }

        .summary-card {
            background: linear-gradient(135deg, var(--kartu-gradasi-1), var(--kartu-gradasi-2));
            color: white;
            padding: 24px 20px;
            border-radius: 14px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .summary-card h3 {
            font-size: 14px;
            font-weight: 500;
            opacity: 0.95;
            letter-spacing: 0.3px;
        }

        .summary-card .total-main {
            font-size: 34px;
            font-weight: 700;
            margin-top: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.3);
            margin: 18px 0 14px 0;
        }

        .countdown-title {
            font-size: 13px;
            font-weight: 600;
            opacity: 0.9;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .countdown-grid {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .countdown-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
            min-width: 65px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .countdown-num {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;
        }

        .countdown-label {
            font-size: 10px;
            text-transform: uppercase;
            opacity: 0.85;
            margin-top: 2px;
            font-weight: 600;
        }

        .monthly-section {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .monthly-section h2 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #111;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
            border-bottom: 2px solid rgba(0, 0, 0, 0.15);
            padding-bottom: 4px;
        }

        .monthly-item {
            background: rgba(255, 255, 255, 0.5);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .monthly-item:last-child {
            margin-bottom: 0;
        }

        .monthly-header {
            font-weight: 700;
            color: var(--warna-utama);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .monthly-details {
            display: flex;
            justify-content: space-between;
            color: #333;
            font-weight: 600;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 14px;
            font-weight: 700;
            color: #111;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        input, select {
            padding: 12px 14px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: rgba(255, 255, 255, 0.75);
            font-weight: 600;
            color: #222;
        }

        input:focus, select:focus {
            border-color: var(--warna-utama);
            background: rgba(255, 255, 255, 0.95);
        }

        button.btn-add {
            background-color: var(--warna-utama);
            color: white;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            margin-top: 5px;
        }

        button.btn-add:hover {
            background-color: var(--warna-hover);
        }

        button.btn-add:active {
            transform: scale(0.99);
        }

        .bg-uploader {
            background: rgba(255, 255, 255, 0.4);
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .bg-uploader label {
            font-weight: 500;
            cursor: pointer;
            color: #111;
        }

        .btn-reset-bg {
            background: none;
            border: none;
            color: #d32f2f;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
            font-weight: 600;
        }

        .history {
            margin-top: 10px;
        }

        .history h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #111;
            border-bottom: 2px solid rgba(0, 0, 0, 0.15);
            padding-bottom: 6px;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
            font-weight: 700;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 10px 8px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            font-size: 13px;
            font-weight: 600;
        }

        th {
            background-color: var(--bg-header-tabel);
            color: var(--teks-header-tabel);
            font-weight: 700;
            border-radius: 4px;
        }

        .badge-person {
            background: rgba(15, 76, 129, 0.15);
            color: var(--warna-utama);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
        }

        .btn-delete {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .btn-delete:hover {
            background-color: #cc0000;
        }

        .empty-text {
            text-align: center;
            color: #111;
            padding: 15px;
            font-size: 14px;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tabungan Pernikahan<br>Hani & Venus 💍</h1>

        <!-- Card Total Tabungan & Countdown -->
        <div class="summary-card">
            <h3>Total Tabungan Terkumpul</h3>
            <div class="total-main" id="totalAmount">Rp 0</div>
            
            <div class="divider"></div>

            <div class="countdown-title">⏳ Menuju Hari Pernikahan (Sabtu, 03 April 2027)</div>
            <div class="countdown-grid">
                <div class="countdown-box">
                    <div class="countdown-num" id="cdDays">0</div>
                    <div class="countdown-label">Hari</div>
                </div>
                <div class="countdown-box">
                    <div class="countdown-num" id="cdHours">0</div>
                    <div class="countdown-label">Jam</div>
                </div>
                <div class="countdown-box">
                    <div class="countdown-num" id="cdMinutes">0</div>
                    <div class="countdown-label">Menit</div>
                </div>
                <div class="countdown-box">
                    <div class="countdown-num" id="cdSeconds">0</div>
                    <div class="countdown-label">Detik</div>
                </div>
            </div>
        </div>

        <!-- Rincian Tabungan Per Bulan -->
        <div class="monthly-section">
            <h2>📊 Rincian Tabungan Per Bulan</h2>
            <div id="monthlyList">
                <!-- Rincian bulanan dibuat otomatis via JS -->
            </div>
        </div>

        <!-- Pengaturan Latar Belakang Foto -->
        <div class="bg-uploader">
            <label>🖼️ <b>Foto Latar:</b> 
                <input type="file" id="bgInput" accept="image/*" style="display:none;">
                <span style="color: var(--warna-utama); text-decoration: underline; font-weight: 700;">Pilih Foto Berdua</span>
            </label>
            <button class="btn-reset-bg" id="resetBgBtn" style="display:none;" onclick="resetBackground()">Hapus Foto</button>
        </div>

        <!-- Form Input -->
        <form id="savingForm">
            <div class="form-group">
                <label for="person">Nama Penabung</label>
                <select id="person" required>
                    <option value="Hani">Hani</option>
                    <option value="Venus">Venus</option>
                </select>
            </div>
            <div class="form-group">
                <label for="date">Tanggal Pemasukan</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label for="amount">Jumlah Tabungan (Rp)</label>
                <input type="number" id="amount" placeholder="Contoh: 500000" min="1" required>
            </div>
            <button type="submit" class="btn-add">Tambah Tabungan</button>
        </form>

        <!-- Riwayat Pemasukan -->
        <div class="history">
            <h2>Riwayat Pemasukan</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nama</th>
                        <th>Tanggal</th>
                        <th>Jumlah</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="historyList">
                    <!-- Data riwayat muncul di sini -->
                </tbody>
            </table>
            <div id="emptyMessage" class="empty-text">Belum ada riwayat tabungan.</div>
        </div>
    </div>

    <script>
        const form = document.getElementById('savingForm');
        const personInput = document.getElementById('person');
        const dateInput = document.getElementById('date');
        const amountInput = document.getElementById('amount');
        const totalAmountEl = document.getElementById('totalAmount');
        const monthlyListEl = document.getElementById('monthlyList');
        const historyListEl = document.getElementById('historyList');
        const emptyMessageEl = document.getElementById('emptyMessage');
        const bgInput = document.getElementById('bgInput');
        const resetBgBtn = document.getElementById('resetBgBtn');

        // Elemen Countdown
        const cdDays = document.getElementById('cdDays');
        const cdHours = document.getElementById('cdHours');
        const cdMinutes = document.getElementById('cdMinutes');
        const cdSeconds = document.getElementById('cdSeconds');

        // Tanggal Pernikahan: Sabtu, 03 April 2027 pukul 08:00 WIB
        const weddingDate = new Date('2027-04-03T08:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            if (distance < 0) {
                cdDays.textContent = "0";
                cdHours.textContent = "0";
                cdMinutes.textContent = "0";
                cdSeconds.textContent = "0";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            cdDays.textContent = days;
            cdHours.textContent = hours;
            cdMinutes.textContent = minutes;
            cdSeconds.textContent = seconds;
        }

        // Jalankan countdown setiap detik
        setInterval(updateCountdown, 1000);
        updateCountdown();

        dateInput.valueAsDate = new Date();

        let savingsData = JSON.parse(localStorage.getItem('wedding_savings_v2')) || [];

        // Load Foto Latar Belakang Tersimpan
        const savedBg = localStorage.getItem('wedding_bg');
        if (savedBg) {
            document.body.style.backgroundImage = `url('${savedBg}')`;
            resetBgBtn.style.display = 'inline';
        }

        // Upload Foto Baru
        bgInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imageData = event.target.result;
                    document.body.style.backgroundImage = `url('${imageData}')`;
                    localStorage.setItem('wedding_bg', imageData);
                    resetBgBtn.style.display = 'inline';
                };
                reader.readAsDataURL(file);
            }
        });

        // Hapus Foto Latar Belakang
        function resetBackground() {
            localStorage.removeItem('wedding_bg');
            document.body.style.backgroundImage = 'none';
            resetBgBtn.style.display = 'none';
            bgInput.value = '';
        }

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                maximumFractionDigits: 0
            }).format(number);
        }

        function formatDate(dateString) {
            const [year, month, day] = dateString.split('-');
            return `${day}/${month}/${year}`;
        }

        function formatMonthYear(monthKey) {
            const [year, month] = monthKey.split('-');
            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            return `${monthNames[parseInt(month) - 1]} ${year}`;
        }

        function renderUI() {
            historyListEl.innerHTML = '';
            monthlyListEl.innerHTML = '';

            let total = 0;
            let monthlyData = {};

            if (savingsData.length === 0) {
                emptyMessageEl.style.display = 'block';
                monthlyListEl.innerHTML = '<div style="font-size:13px; text-align:center; color:#333;">Belum ada data bulanan.</div>';
            } else {
                emptyMessageEl.style.display = 'none';
                savingsData.sort((a, b) => new Date(b.date) - new Date(a.date));

                savingsData.forEach((item, index) => {
                    const val = Number(item.amount);
                    total += val;

                    // Kelompokkan Per Bulan (YYYY-MM)
                    const monthKey = item.date.substring(0, 7);
                    if (!monthlyData[monthKey]) {
                        monthlyData[monthKey] = { Hani: 0, Venus: 0, total: 0 };
                    }
                    monthlyData[monthKey][item.person] = (monthlyData[monthKey][item.person] || 0) + val;
                    monthlyData[monthKey].total += val;

                    // Buat Baris Tabel Riwayat
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><span class="badge-person">${item.person || 'Hani'}</span></td>
                        <td>${formatDate(item.date)}</td>
                        <td>${formatRupiah(item.amount)}</td>
                        <td>
                            <button class="btn-delete" onclick="deleteItem(${index})">Hapus</button>
                        </td>
                    `;
                    historyListEl.appendChild(row);
                });

                // Render Rincian Bulanan
                Object.keys(monthlyData).sort().reverse().forEach(mKey => {
                    const mInfo = monthlyData[mKey];
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'monthly-item';
                    itemDiv.innerHTML = `
                        <div class="monthly-header">
                            <span>📅 ${formatMonthYear(mKey)}</span>
                            <span>Total: ${formatRupiah(mInfo.total)}</span>
                        </div>
                        <div class="monthly-details">
                            <span>Hani: ${formatRupiah(mInfo.Hani)}</span>
                            <span>Venus: ${formatRupiah(mInfo.Venus)}</span>
                        </div>
                    `;
                    monthlyListEl.appendChild(itemDiv);
                });
            }

            totalAmountEl.textContent = formatRupiah(total);
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const newEntry = {
                person: personInput.value,
                date: dateInput.value,
                amount: pars
